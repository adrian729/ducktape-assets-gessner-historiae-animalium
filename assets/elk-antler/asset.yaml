title: Elk antler
description: A single palmated antler of a European elk (moose) standing upright, the broad veined palm rising from a knobbed burr at the lower right and ending in a row of pointed tines along the left edge and across the top. Black woodcut line on the beige paper tone of the page, which is kept inside the outline; the background outside the antler is transparent.
